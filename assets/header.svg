<style>@font-face{font-family:'CG';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'CGi';font-weight:500;font-style:italic;src:url(data:font/woff2;base64,) format('woff2');}
