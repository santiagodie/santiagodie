name: Generate profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG de la serpiente (paleta Old Money)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B1F3A&color_dots=#EDE6D3,#E6D29A,#D4AF37,#A8861E,#14284B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#14284B,#3A4F6E,#8C7A3E,#C9A227,#F5F0E1

      - name: Generar tarjeta de stats (paleta Old Money)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&include_all_commits=true&bg_color=0B1F3A&title_color=D4AF37&text_color=F5F0E1&icon_color=C9A227&ring_color=C9A227&border_color=0B1F3A&border_radius=6
          path: dist/github-stats.svg
          core_version: 2.2.1
          fail_on_error: "true"
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generar tarjeta de lenguajes (paleta Old Money)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0B1F3A&title_color=D4AF37&text_color=F5F0E1&border_color=0B1F3A&border_radius=6
          path: dist/github-top-langs.svg
          core_version: 2.2.1
          fail_on_error: "true"
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
